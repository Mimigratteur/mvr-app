plugins { id 'com.android.application' }
android {
    namespace 'fr.lutrin.mvr'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.lutrin.mvr'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../mvr.keystore')
            storePassword 'mvrlutrin2026'
            keyAlias 'mvr'
            keyPassword 'mvrlutrin2026'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
