name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [apk]
    paths: ['android/app/**', 'android/*.gradle', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Commit APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/MVR.apk
          git config user.name "apk-bot"; git config user.email "apk-bot@users.noreply.github.com"
          git add -f android/dist/MVR.apk
          git commit -m "APK construit" || echo "rien"
          git push
