name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [apk]
    paths: ['android/app/**', 'android/*.gradle', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        working-directory: android
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; gradle assembleRelease --no-daemon
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MVR.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MVR.apk --title "MVR APK" --notes "APK Android de MVR" --target apk
